server:
  port: 8085
  servlet:
    context-path: /api

spring:
  application:
    name: property-management
  datasource:
    url: jdbc:sqlite:./data/property.db
    driver-class-name: org.sqlite.JDBC
    username: admin
    password: admin123
    hikari:
      maximum-pool-size: 5
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.sqlite.hibernate.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

file:
  upload:
    path: ./uploads
